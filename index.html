<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/nakama-words/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0a2240" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Palabra Hunter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@700;800;900&display=swap"
      rel="stylesheet"
    />
    <style>
      body { margin: 0; background: #0a2240; }

      #splash {
        position: fixed;
        inset: 0;
        background: #0a2240;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        z-index: 9999;
        transition: opacity 0.35s ease;
      }

      #splash-emoji {
        font-size: 88px;
        line-height: 1;
        animation: splash-bob 1.8s ease-in-out infinite;
      }

      #splash-title {
        font-family: 'Bangers', cursive;
        font-size: 44px;
        color: #f5c518;
        letter-spacing: 0.12em;
        line-height: 1;
        text-shadow: 3px 3px 0 #0a2240, 4px 4px 0 rgba(0,0,0,0.4);
      }

      #splash-bar {
        width: 56px;
        height: 4px;
        background: #2dd4bf;
        border-radius: 2px;
        animation: splash-pulse 1s ease-in-out infinite;
      }

      @keyframes splash-bob {
        0%, 100% { transform: translateY(0); }
        50%       { transform: translateY(-10px); }
      }

      @keyframes splash-pulse {
        0%, 100% { opacity: 0.25; transform: scaleX(0.5); }
        50%       { opacity: 1;    transform: scaleX(1);   }
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <div id="splash-emoji">🏴‍☠️</div>
      <div id="splash-title">PALABRA HUNTER</div>
      <div id="splash-bar"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
